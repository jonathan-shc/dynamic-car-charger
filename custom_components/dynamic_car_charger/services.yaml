set_session:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dynamic_car_charger
    target_percentage:
      example: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    energy_to_charge:
      example: 20
      selector:
        number:
          min: 0
          max: 200
          step: 0.5
          unit_of_measurement: "kWh"
          mode: box
    ready_by:
      example: "2026-09-25 07:30:00"
      selector:
        datetime:
    automatic_charging:
      selector:
        boolean:
    charge_now:
      selector:
        boolean:
get_sessions:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dynamic_car_charger
add_sessions:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dynamic_car_charger
    sessions:
      required: true
      example: '[{"started": "2026-09-19T00:30:00+02:00", "ended": "2026-09-19T16:47:00+02:00", "energy_kwh": 36.2, "cost": 4.82, "reconstructed": true}]'
      selector:
        object:
get_trips:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dynamic_car_charger
    limit:
      example: 20
      selector:
        number:
          min: 1
          max: 1000
          mode: box
set_schedule:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dynamic_car_charger
    days:
      example: '{"mon": "07:30", "tue": "07:30", "fri": "09:00"}'
      selector:
        object:
    targets:
      example: '{"fri": 100}'
      selector:
        object:
    usage:
      example: '{"mon": 15, "tue": 15}'
      selector:
        object:
    enabled:
      selector:
        boolean:

rebuild_today_trips:
  description: Reprocess today's recorded GPS trips using the current stop rules. Older trips are preserved.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: dynamic_car_charger

delete_trip:
  name: Delete trip
  description: Remove one stored trip by its exact start time or provider track ID.
  fields:
    config_entry_id:
      name: Config entry ID
      required: true
      selector:
        config_entry:
          integration: dynamic_car_charger
    started:
      name: Started
      description: Exact start timestamp of the stored trip.
      selector:
        datetime:
    track_id:
      name: Track ID
      description: Provider track ID of the stored trip.
      selector:
        text:
set_push_credentials:
  fields:
    key_id:
      required: true
      example: "ABC123DEFG"
      selector:
        text:
    team_id:
      required: true
      example: "R387DG8767"
      selector:
        text:
    bundle_id:
      default: "app.chargeremote"
      selector:
        text:
    private_key:
      required: true
      selector:
        text:
          multiline: true
    sandbox:
      default: false
      selector:
        boolean:
register_push:
  fields:
    device_id:
      required: true
      selector:
        text:
    device_token:
      selector:
        text:
    start_token:
      selector:
        text:
    activities:
      selector:
        object:
    language:
      selector:
        text:
    alerts:
      selector:
        boolean:
    entries:
      selector:
        object:

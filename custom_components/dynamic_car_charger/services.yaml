set_session:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dynamic_car_charger
    target_percentage:
      example: 80
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    energy_to_charge:
      example: 20
      selector:
        number:
          min: 0
          max: 200
          step: 0.5
          unit_of_measurement: "kWh"
          mode: box
    ready_by:
      example: "2026-09-25 07:30:00"
      selector:
        datetime:
    automatic_charging:
      selector:
        boolean:
    charge_now:
      selector:
        boolean:
get_sessions:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dynamic_car_charger
add_sessions:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: dynamic_car_charger
    sessions:
      required: true
      example: '[{"started": "2026-09-19T00:30:00+02:00", "ended": "2026-09-19T16:47:00+02:00", "energy_kwh": 36.2, "cost": 4.82, "reconstructed": true}]'
      selector:
        object:

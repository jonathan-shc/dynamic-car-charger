# Live Activity for iOS 17.2+ and Home Assistant Core 2026.7+.
# Replace the notify action if your mobile app uses a different device name.
alias: Dynamic Car Charger - iPhone Live Activity
description: Show charging progress on the Lock Screen and Dynamic Island
mode: single

triggers:
  - trigger: template
    value_template: >-
      {{ states('sensor.dynamic_car_charger_charging_plan') in
      ['charging', 'charging_overtime', 'awaiting_soc_confirmation'] }}
    id: start

  - trigger: time_pattern
    minutes: "/5"
    id: refresh

  - trigger: state
    entity_id: number.dynamic_car_charger_target_charge
    id: target_changed

  - trigger: template
    value_template: >-
      {{ states('sensor.dynamic_car_charger_charging_plan') not in
      ['charging', 'charging_overtime', 'awaiting_soc_confirmation', 'starting_charge',
      'unlocking_charger'] }}
    for: "00:01:30"
    id: stop

conditions: []

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id in ['start', 'refresh', 'target_changed'] and
              states('sensor.dynamic_car_charger_charging_plan') in
              ['charging', 'charging_overtime', 'awaiting_soc_confirmation'] }}
        sequence:
          - variables:
              current_soc: >-
                {{ state_attr('sensor.dynamic_car_charger_charging_plan',
                'measured_soc') | float(0) | round(0) | int }}
              target_soc: >-
                {{ states('number.dynamic_car_charger_target_charge') |
                float(80) | round(0) | int }}
              estimated_cost: >-
                {{ state_attr('sensor.dynamic_car_charger_charging_plan',
                'estimated_cost_eur') }}
              plan_summary: >-
                {% set plan = 'sensor.dynamic_car_charger_charging_plan' %}
                {% set slots = state_attr(plan, 'slots') or [] %}
                {% set now_ts = as_timestamp(now()) %}
                {% set ns = namespace(active=false, current_end=none,
                next_start=none) %}
                {% for slot in slots %}
                  {% set start_ts = as_timestamp(slot.start, 0) %}
                  {% set end_ts = as_timestamp(slot.end, 0) %}
                  {% if not ns.active and start_ts <= now_ts and now_ts < end_ts %}
                    {% set ns.active = true %}
                    {% set ns.current_end = end_ts %}
                  {% elif ns.active and ns.next_start is none %}
                    {% if start_ts <= ns.current_end + 1 %}
                      {% set ns.current_end = [ns.current_end, end_ts] | max %}
                    {% else %}
                      {% set ns.next_start = start_ts %}
                    {% endif %}
                  {% elif not ns.active and ns.next_start is none and start_ts > now_ts %}
                    {% set ns.next_start = start_ts %}
                  {% endif %}
                {% endfor %}
                {% if states(plan) == 'charging_overtime' %}
                  Extended until {{ as_timestamp(
                  state_attr(plan, 'deadline_extension_until'), 0) |
                  timestamp_custom('%H:%M', true) }}
                {% elif ns.current_end is not none %}
                  Now until {{ ns.current_end |
                  timestamp_custom('%H:%M', true) }}
                  {%- if ns.next_start is not none %} · then {{ ns.next_start |
                  timestamp_custom('%H:%M', true) }}{% endif %}
                {% elif ns.next_start is not none %}
                  Next {{ ns.next_start |
                  timestamp_custom('%d-%m %H:%M', true) }}
                {% else %}
                  Updating the charging plan
                {% endif %}
          - action: notify.mobile_app_REPLACE_WITH_YOUR_IPHONE
            data:
              title: Car charging
              message: >-
                {{ current_soc }}% → {{ target_soc }}% · {{ plan_summary }} ·
                {% if estimated_cost not in [none, 'None', 'unknown',
                'unavailable', ''] %}est. €{{ '%.2f' |
                format(estimated_cost | float(0)) }}{% else %}calculating
                cost{% endif %}
              data:
                tag: car_charging
                live_update: true
                silent: "{{ trigger.id != 'start' }}"
                alert_once: true
                critical_text: "{{ current_soc }}%"
                progress: "{{ current_soc }}"
                progress_max: "{{ target_soc }}"
                notification_icon: mdi:car-electric
                notification_icon_color: "#03A9F4"
                progress_bar_color: "#03A9F4"
                background_color: "#101820"
                text_color: "#FFFFFF"
                url: /lovelace/REPLACE_WITH_YOUR_DASHBOARD

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'stop' }}"
        sequence:
          - action: notify.mobile_app_REPLACE_WITH_YOUR_IPHONE
            data:
              message: clear_notification
              data:
                tag: car_charging
